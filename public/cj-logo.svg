<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Chromatic Aberration Filter for LOGO Badge like user's image -->
    <filter id="chromaticGlitch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="0" stdDeviation="0.5" flood-color="#00f0ff" flood-opacity="0.9" />
      <feDropShadow dx="2" dy="0" stdDeviation="0.5" flood-color="#ff2a2a" flood-opacity="0.9" />
    </filter>
    
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#1f222e" />
    </linearGradient>

    <linearGradient id="neonRedAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>
  </defs>

  <!-- ================= BOOK SHAPED LOGO BASE ================= -->
  <!-- Left & Right Open Book Wings (Geometric Futuristic Style) -->
  <g transform="translate(160, 115)">
    <!-- Book Spine Glow Base -->
    <rect x="-8" y="-50" width="16" height="82" rx="4" fill="#ff2a2a" opacity="0.85" />
    
    <!-- Left Wing (Back cover) -->
    <path d="M -8,-45 L -105,-25 C -112,-23 -116,-17 -116,-9 L -116,42 C -116,48 -110,54 -103,52 L -8,32 Z" 
          fill="url(#bookCoverGrad)" stroke="#0a0a0c" stroke-width="2" />

    <!-- Left Wing Pages (Layered Cyber Paper) -->
    <path d="M -8,-40 L -98,-22 C -103,-21 -107,-16 -107,-10 L -107,36 C -107,41 -102,45 -96,44 L -8,28 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M -8,-35 L -92,-19 C -96,-18 -100,-14 -100,-8 L -100,32 C -100,37 -95,40 -90,39 L -8,25 Z" 
          fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Right Wing (Back cover) -->
    <path d="M 8,-45 L 105,-25 C 112,-23 116,-17 116,-9 L 116,42 C 116,48 110,54 103,52 L 8,32 Z" 
          fill="url(#bookCoverGrad)" stroke="#0a0a0c" stroke-width="2" />

    <!-- Right Wing Pages (Layered Cyber Paper) -->
    <path d="M 8,-40 L 98,-22 C 103,-21 107,-16 107,-10 L 107,36 C 107,41 102,45 96,44 L 8,28 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 8,-35 L 92,-19 C 96,-18 100,-14 100,-8 L 100,32 C 100,37 95,40 90,39 L 8,25 Z" 
          fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Technical Book Spine Center Cut -->
    <rect x="-4" y="-45" width="8" height="75" rx="3" fill="#0a0a0c" />
    <circle cx="0" cy="-35" r="2.5" fill="#ff2a2a" />
    <circle cx="0" cy="20" r="2.5" fill="#ff2a2a" />

    <!-- "C" Letter in bold futuristic stencil on Left Page -->
    <path d="M -30,-15 L -62,-8 C -70,-6 -74,0 -74,8 L -74,12 C -74,20 -69,25 -60,23 L -30,17 L -30,5 L -54,10 C -58,11 -60,9 -60,5 L -60,2 C -60,-2 -58,-4 -54,-5 L -30,-1 Z" 
          fill="#0a0a0c" />

    <!-- "J" Letter in bold futuristic stencil on Right Page -->
    <path d="M 64,-10 L 64,12 C 64,22 56,26 44,24 L 30,21 C 24,20 20,15 20,9 L 20,2 L 32,4 L 32,8 C 32,12 35,13 40,14 L 46,15 C 50,16 52,14 52,10 L 52,-13 Z" 
          fill="#ff2a2a" />

    <!-- Tech Circuit Pin Marks on Pages -->
    <line x1="-80" y1="-3" x2="-86" y2="-1" stroke="#ff2a2a" stroke-width="2" />
    <line x1="80" y1="-3" x2="86" y2="-1" stroke="#0a0a0c" stroke-width="2" />
  </g>

  <!-- ================= CJ SHOP TITLE TYPOGRAPHY ================= -->
  <g transform="translate(160, 230)">
    <!-- CJ Text -->
    <text x="-48" y="0" 
          font-family="'Orbitron', 'Space Grotesk', sans-serif" 
          font-size="44" 
          font-weight="900" 
          fill="#0a0a0c" 
          letter-spacing="-1" 
          text-anchor="middle">
      CJ
    </text>
    
    <!-- Red dot separator -->
    <circle cx="-16" cy="-12" r="5" fill="#ff2a2a" />

    <!-- SHOP Text -->
    <text x="46" y="0" 
          font-family="'Orbitron', 'Space Grotesk', sans-serif" 
          font-size="44" 
          font-weight="900" 
          fill="#0a0a0c" 
          letter-spacing="-1" 
          text-anchor="middle">
      SHOP
    </text>

    <!-- Subtitle -->
    <text x="0" y="24" 
          font-family="'Space Grotesk', monospace" 
          font-size="12" 
          font-weight="700" 
          fill="#ff2a2a" 
          letter-spacing="4" 
          text-anchor="middle">
      DIGITAL E-BOOK STORE
    </text>
  </g>

  <!-- ================= TILTED "LOGO" BADGE (User Reference Image) ================= -->
  <!-- Exactly matching the user's uploaded badge: Tilted rounded black pill with chromatic glitch "LOGO" -->
  <g transform="translate(305, 55) rotate(26)">
    <!-- Shadow -->
    <rect x="-56" y="-22" width="112" height="44" rx="10" fill="rgba(0,0,0,0.15)" transform="translate(2, 4)" />
    
    <!-- Main Black Badge -->
    <rect x="-56" y="-22" width="112" height="44" rx="10" fill="#0a0a0c" stroke="#1f2430" stroke-width="2" />

    <!-- "LOGO" Text with Chromatic Aberration Glitch (Cyan & Red Offset) -->
    <!-- Cyan Shadow Layer -->
    <text x="0" y="8" 
          font-family="'Orbitron', 'Space Grotesk', sans-serif" 
          font-size="21" 
          font-weight="900" 
          letter-spacing="3" 
          fill="none" 
          stroke="#00e5ff" 
          stroke-width="1.5" 
          text-anchor="middle"
          transform="translate(-1.5, 0)">
      LOGO
    </text>

    <!-- Red Shadow Layer -->
    <text x="0" y="8" 
          font-family="'Orbitron', 'Space Grotesk', sans-serif" 
          font-size="21" 
          font-weight="900" 
          letter-spacing="3" 
          fill="none" 
          stroke="#ff2a2a" 
          stroke-width="1.5" 
          text-anchor="middle"
          transform="translate(1.5, 0)">
      LOGO
    </text>

    <!-- White Top Text -->
    <text x="0" y="8" 
          font-family="'Orbitron', 'Space Grotesk', sans-serif" 
          font-size="21" 
          font-weight="900" 
          letter-spacing="3" 
          fill="#ffffff" 
          text-anchor="middle">
      LOGO
    </text>
  </g>
</svg>
